<p>Try to retype this:</p>
<p class="text-to-repeat">{{ textRepeatContent().challengeText }}</p>

<label for="repeat-input">Your answer</label>
<input
  id="repeat-input"
  type="text"
  [disabled]="isReadOnly()"
  (input)="onTyping($event)"
  [value]="isReadOnly() ? textRepeatContent().challengeText : textTyped()"
/>

@if (!isReadOnly()) {
  <button class="btn-submit" (click)="onSubmit()">Submit</button>
}
