<div class="controls">
  @if (captchaState.currentStageIndex() > 0) {
  <button (click)="onPrevious()">Previous</button>
  }
  @if (currentStageStatus() === 'passed') {
  <button class="align-right" (click)="captchaState.advance()">Next</button>
  }
</div>


<div class="challenge-container">
  @switch (currentStageType()) {
  @case ('image-grid') {
  <app-image-grid [existingContent]="currentImageGridContent()" (result)="onChallengeResult($event)" />
  }
  @case ('text-repeat') {
  <app-text-repeat [existingContent]="currentTextRepeatContent()" (result)="onChallengeResult($event)" />
  }
  @case ('arithmetic') {
  <app-arithmetic [existingContent]="currentArithmeticContent()" (result)="onChallengeResult($event)" />
  }
  }
</div>
