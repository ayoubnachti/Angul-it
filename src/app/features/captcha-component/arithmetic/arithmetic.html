<p>Can you solve this:</p>

<label for="repeat-input">Your answer</label>

<div class="arithmetic-inline">
  <span>{{ arithmeticContent().operandA }}</span>
  <span>{{ arithmeticContent().operator }}</span>
  <span>{{ arithmeticContent().operandB }}</span>
  <span>=</span>
  <input
    type="text"
    aria-label="Your answer"
    [disabled]="isReadOnly()"
    (input)="onInput($event)"
  />
</div>

@if (!isReadOnly()) {
  <button (click)="onSubmit()">Submit</button>
}
