<p>Can you solve this:</p>

<form [formGroup]="arithmeticForm" (ngSubmit)="onSubmit()">
  <div class="arithmetic-inline">
    <span>{{ arithmeticContent().operandA }}</span>
    <span>{{ arithmeticContent().operator }}</span>
    <span>{{ arithmeticContent().operandB }}</span>
    <span>=</span>
    <input type="number" aria-label="Your answer" formControlName="answer" />
  </div>

  @if (arithmeticForm.controls.answer.invalid && arithmeticForm.controls.answer.touched) {
    <p class="field-error">Not quite — try again.</p>
  }

  @if (!isReadOnly()) {
    <button class="btn-submit" type="submit">Submit</button>
  }
</form>
