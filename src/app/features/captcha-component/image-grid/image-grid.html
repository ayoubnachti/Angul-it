<form [formGroup]="imageGridForm" (ngSubmit)="onSubmit()">
  <fieldset class="image-grid">
    <legend>Select all {{ imageGridContent().targetLabel }}s</legend>

    @for (image of imageGridContent().images; track image.id) {
      <label class="image-cell">
        <input type="checkbox" [formControlName]="image.id" />
        <img [src]="image.src" alt="" />
      </label>
    }
  </fieldset>

  @if (imageGridForm.invalid && hasSubmitted()) {
    <p class="field-error">Not quite — try again.</p>
  }

  @if (!isReadOnly()) {
    <button class="btn-submit" type="submit">Submit</button>
  }
</form>
